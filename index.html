<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedagogia & Cuidado | Apoio pedagógico</title>
<style>:root{--bg:#fbf8ff;--c:#ffffff;--t:#2a2140;--m:#6c618a;--a:#7a4fd3;--on:#ffffff;--l:#e3daf3}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:var(--c);border-bottom:1px solid var(--l)}header b{font-size:1.25rem}nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center}nav a{color:var(--t);text-decoration:none;font-weight:600;font-size:.92rem}
.btn{display:inline-block;background:var(--a);color:var(--on);border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.o{background:none;color:var(--a);border:2px solid var(--a)}
.hero{padding:64px 18px;text-align:center;background:linear-gradient(160deg,var(--c),var(--bg))}.hero h1{margin:0 auto;max-width:18ch;font-size:clamp(2rem,6vw,3.4rem);line-height:1.1}.hero p{max-width:55ch;margin:14px auto 22px;color:var(--m);font-size:1.1rem}
section{max-width:1060px;margin:0 auto;padding:44px 18px}h2{font-size:1.6rem;margin:0 0 18px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.k{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:18px}.k h3{margin:0 0 6px;font-size:1.05rem}.k p{margin:0;color:var(--m);font-size:.95rem}.em{font-size:2.4rem;display:block;margin-bottom:8px}.pr{font-weight:800;font-size:1.2rem;margin:8px 0}
#cart{position:fixed;right:14px;bottom:14px;z-index:9}#cp{display:none;position:fixed;right:14px;bottom:70px;width:min(340px,92vw);max-height:60vh;overflow:auto;background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;z-index:9;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.it{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--l);font-size:.9rem}form{display:grid;gap:10px;max-width:520px}input,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit}
footer{text-align:center;padding:26px 18px;color:var(--m);font-size:.88rem;border-top:1px solid var(--l)}#ok{color:var(--a);font-weight:700;min-height:1.4em}
</style></head><body>
<header><b>Pedagogia & Cuidado</b><nav><a href="#inicio">Início</a><a href="#s0">Nossos serviços</a><a href="#s1">Como trabalhamos</a><a href="#contato">Contato</a></nav></header>
<div class="hero" id="inicio"><h1>Aprender com leveza, no ritmo de cada criança</h1><p>Acompanhamento pedagógico, reforço escolar e orientação para famílias e escolas.</p><a class="btn" href="#contato">Agendar conversa</a></div>
<div id="app"></div>
<section id="contato"><h2>Fale com a gente</h2><form id="f"><input id="n" placeholder="Seu nome" required><input id="e" type="email" placeholder="Seu e-mail" required><textarea id="m" rows="4" placeholder="Sua mensagem" required></textarea><button class="btn">Enviar mensagem</button><div id="ok" role="status"></div></form></section>
<footer>© Pedagogia & Cuidado · Desenvolvido por Mateus Pereira</footer>
<button class="btn" id="cart" style="display:none">🛒 Carrinho (<span id="cn">0</span>)</button><div id="cp"></div>
<script>
var D={"id": "Site-de-Pedagogia", "sections": [["Nossos serviços", [["🧩", "Psicopedagogia", "Avaliação e apoio às dificuldades de aprendizagem."], ["📚", "Reforço escolar", "Aulas individuais com atividades lúdicas."], ["👨‍👩‍👧", "Orientação à família", "Dicas práticas para apoiar os estudos em casa."], ["🏫", "Formação de professores", "Oficinas e palestras para equipes escolares."]]], ["Como trabalhamos", [["1️⃣", "Conversa inicial", "Entendemos a rotina e as necessidades."], ["2️⃣", "Plano personalizado", "Atividades pensadas para cada criança."], ["3️⃣", "Acompanhamento", "Relatórios e ajustes ao longo do caminho."]]]]},$=function(i){return document.getElementById(i)},R=function(n){return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})},cart={},html="";
if(D.products){html+='<section id="produtos"><h2>Produtos</h2><div class="g">'+D.products.map(function(p,i){return'<div class="k"><span class="em">'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[3]+'</p><div class="pr">'+R(p[2])+'</div><button class="btn" data-i="'+i+'">Adicionar</button></div>'}).join("")+'</div></section>'}
D.sections.forEach(function(s,j){html+='<section id="s'+j+'"><h2>'+s[0]+'</h2><div class="g">'+s[1].map(function(c){return'<div class="k"><span class="em">'+c[0]+'</span><h3>'+c[1]+'</h3><p>'+c[2]+'</p></div>'}).join("")+'</div></section>'});
$("app").innerHTML=html;
function draw(){var ks=Object.keys(cart),n=0,t=0;ks.forEach(function(k){n+=cart[k];t+=cart[k]*D.products[k][2]});$("cn").textContent=n;$("cart").style.display=D.products?"block":"none";
 $("cp").innerHTML='<b>Seu carrinho</b>'+(ks.length?ks.map(function(k){return'<div class="it"><span>'+D.products[k][1]+' × '+cart[k]+'</span><span>'+R(cart[k]*D.products[k][2])+' <button data-r="'+k+'" style="border:0;background:none;cursor:pointer" title="Remover">✕</button></span></div>'}).join("")+'<div class="it"><b>Total</b><b>'+R(t)+'</b></div><button class="btn" id="fin" style="width:100%;margin-top:10px">Finalizar pedido</button>':'<p>Seu carrinho está vazio.</p>')}
document.addEventListener("click",function(e){var a=e.target.closest("[data-i]"),r=e.target.closest("[data-r]");if(a){cart[a.dataset.i]=(cart[a.dataset.i]||0)+1;draw()}if(r){delete cart[r.dataset.r];draw()}
 if(e.target.id==="cart")$("cp").style.display=$("cp").style.display==="block"?"none":"block";
 if(e.target.id==="fin"){cart={};draw();$("cp").innerHTML='<b>Pedido recebido!</b><p>Obrigado pela compra. Em breve entraremos em contato.</p>'}});
$("f").onsubmit=function(e){e.preventDefault();try{var h=JSON.parse(localStorage.getItem("msgs_"+D.id)||"[]");h.push({n:$("n").value,e:$("e").value,m:$("m").value,d:new Date().toISOString()});localStorage.setItem("msgs_"+D.id,JSON.stringify(h))}catch(x){}$("ok").textContent="Mensagem enviada! Obrigado pelo contato.";$("f").reset()};
draw();
</script></body></html>
